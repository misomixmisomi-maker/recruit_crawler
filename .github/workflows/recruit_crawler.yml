name: Daily recruitment collection

on:
  schedule:
    - cron: '10 23 * * *' # 08:10 Asia/Seoul, before the 09:00 briefing
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'briefing_pipeline.py'
      - 'saramin_crawler.py'
      - 'test_briefing_pipeline.py'
      - 'requirements.txt'
      - 'collection-request.json'
      - '.github/workflows/recruit_crawler.yml'

permissions:
  contents: write

concurrency:
  group: daily-recruitment-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test parsers and filters
        run: python -m unittest -v test_briefing_pipeline.py
      - name: Collect both sources
        id: collect
        continue-on-error: true
        run: python -u briefing_pipeline.py --pages 2 --detail-limit 12
      - name: Preserve collection result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: recruitment-results
          path: daily-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish machine-readable result branch
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const files = ['latest.json', 'status.json', 'latest.md', 'candidates.csv'];
            if (!files.every(f => fs.existsSync('daily-results/' + f))) {
              core.setFailed('No complete output bundle; previous result was not overwritten.');
              return;
            }
            const {owner, repo} = context.repo;
            const branch = 'briefing-data';
            let parent = null, baseTree = null;
            try {
              const ref = await github.rest.git.getRef({owner, repo, ref: 'heads/' + branch});
              parent = ref.data.object.sha;
              const commit = await github.rest.git.getCommit({owner, repo, commit_sha: parent});
              baseTree = commit.data.tree.sha;
            } catch (e) { if (e.status !== 404) throw e; }
            const tree = [];
            for (const file of files) {
              const blob = await github.rest.git.createBlob({owner, repo,
                content: fs.readFileSync('daily-results/' + file).toString('base64'), encoding: 'base64'});
              tree.push({path: file, mode: '100644', type: 'blob', sha: blob.data.sha});
            }
            const newTree = await github.rest.git.createTree({owner, repo, tree,
              ...(baseTree ? {base_tree: baseTree} : {})});
            const commit = await github.rest.git.createCommit({owner, repo,
              message: 'Collect public job listings: ' + new Date().toISOString(),
              tree: newTree.data.sha, parents: parent ? [parent] : []});
            if (parent) await github.rest.git.updateRef({owner, repo,
              ref: 'heads/' + branch, sha: commit.data.sha, force: false});
            else await github.rest.git.createRef({owner, repo,
              ref: 'refs/heads/' + branch, sha: commit.data.sha});
            core.summary.addHeading('Collection output')
              .addRaw('Read briefing-data/status.json before using latest.json. Candidates require review.')
              .addLink('Latest result', 'https://github.com/' + owner + '/' + repo + '/blob/briefing-data/latest.md');
            await core.summary.write();
      - name: Report partial or blocked collection
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'At least one source failed. See published status.json; this does not mean zero matching jobs.'
          exit 1
